
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BookNest</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <nav class="navbar">
        <h2 class="logo">BookNest Admin</h2>

        <div class="nav-links">
            <a href="index.html">Visit Store</a>
            <a href="books.html">Books</a>
        </div>
    </nav>

    <main class="admin-container">

        <h1>Admin Dashboard</h1>
        <p>Manage your bookstore catalogue.</p>

        <section class="admin-form">
            <h2>Add New Book</h2>

            <form id="addBookForm">

                <label for="bookTitle">Book Title</label>
                <input type="text" id="bookTitle" required>

                <label for="bookAuthor">Author</label>
                <input type="text" id="bookAuthor" required>

                <label for="bookCategory">Category</label>
                <select id="bookCategory" required>
                    <option value="">Select Category</option>
                    <option value="Academic">Academic</option>
                    <option value="Novel">Novel</option>
                    <option value="Technical">Technical</option>
                    <option value="Competitive Exams">Competitive Exams</option>
                    <option value="Self-help">Self-help</option>
                </select>

                <label for="bookPrice">Price</label>
                <input type="number" id="bookPrice" min="1" required>

                <label for="bookRating">Rating</label>
                <input type="number" id="bookRating" min="0" max="5" step="0.1" value="4.5" required>

                <label for="bookISBN">ISBN</label>
                <input type="text" id="bookISBN" required>

                <label for="bookDescription">Description</label>
                <textarea id="bookDescription" rows="3" required></textarea>

                <button type="submit">Add Book</button>
            </form>
        </section>

        <section class="admin-books">
            <h2>Manage Books</h2>
            <div id="adminBookList"></div>
        </section>

    </main>

    <script src="../js/data.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
